<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teleprompter</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
               font-family: system-ui, sans-serif; }
  #scroller { position: fixed; inset: 0; overflow: hidden; scroll-behavior: smooth; }
  #flip { transform-origin: center; }
  #text { white-space: pre-wrap; padding: 45vh 6vw 60vh; line-height: 1.3; word-wrap: break-word; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; color: #888; text-align: center; padding: 1rem; }
  .btn { position: fixed; top: 10px; right: 10px; z-index: 5; font-size: 1rem; padding: .6rem 1rem;
         border: 0; border-radius: 6px; background: rgba(60,60,60,.85); color: #fff; cursor: pointer; }
  #stop { background: #b83232; }
  #guide { position: fixed; left: 0; right: 0; top: 45vh; height: 0; border-top: 2px solid rgba(255,80,80,.5);
           pointer-events: none; }
  /* Viewer (phone): text only in the bottom half of the screen (center to bottom), top half stays empty. */
  body.viewer #scroller { inset: 50vh 0 0 0; }
  body.viewer #text { padding: 2vh 6vw 50vh; }
  body.viewer #guide { top: 50vh; }
  /* Horizontal mode: one line scrolling sideways, full screen, regular padding. */
  body.horizontal #scroller { inset: 0; display: flex; align-items: center; }
  body.horizontal #flip { flex: none; }
  body.horizontal #text { white-space: pre; padding: 0 6vw; }
  body.horizontal #guide { display: none; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="status">Connecting...</div>
<div id="scroller" class="hidden"><div id="flip"><div id="text"></div></div></div>
<div id="guide" class="hidden"></div>
<button id="full" class="btn hidden">Fullscreen</button>
<button id="stop" class="btn hidden">Stop</button>

<script>
const isController = new URLSearchParams(location.search).get('role') === 'controller';
const $ = id => document.getElementById(id);
document.body.classList.toggle('viewer', !isController);
let config = null, steps = 0, ws;

// One key press scrolls (speed * 25%) of the font size, so every device scrolls the same amount of text.
function stepPx() { return config.size * 0.25 * (config.speed || 2); }

function applyScroll() {
  if (!config) return;
  const s = $('scroller');
  const horizontal = !!config.horizontal;
  const max = horizontal ? s.scrollWidth - s.clientWidth : s.scrollHeight - s.clientHeight;
  steps = Math.max(0, Math.min(steps, Math.ceil(max / stepPx())));
  const offset = Math.min(max, steps * stepPx());
  // A mirrored axis puts the start of the text at the far end of the scroll range.
  const mirrored = horizontal ? config.flipH : config.flipV;
  const pos = Math.max(0, mirrored ? max - offset : offset);
  if (horizontal) s.scrollLeft = pos; else s.scrollTop = pos;
}

function show(state) {
  const running = state.running;
  $('status').classList.toggle('hidden', running);
  $('scroller').classList.toggle('hidden', !running);
  $('guide').classList.toggle('hidden', !running);
  $('stop').classList.toggle('hidden', !(running && isController));
  $('full').classList.toggle('hidden', !(running && !isController && document.fullscreenEnabled));
  if (!running) {
    config = null;
    if (isController) { location.href = '/'; return; }
    $('status').textContent = 'Waiting for the presenter to press Run...';
    return;
  }
  config = state.config; steps = state.steps;
  document.body.classList.toggle('horizontal', !!config.horizontal);
  // Line breaks become a gap between sentences in single-line mode.
  $('text').textContent = config.horizontal ? config.text.trim().replace(/\s*\n+\s*/g, '      ') : config.text;
  $('text').style.fontSize = config.size + 'px';
  $('flip').style.transform = `scale(${config.flipH ? -1 : 1}, ${config.flipV ? -1 : 1})`;
  applyScroll();
}

function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'state') show(m);
    else if (m.type === 'scroll' && config) {
      steps = Math.max(0, steps + (m.dir === 'up' ? -1 : 1));
      applyScroll();
    }
  };
  ws.onclose = () => {
    $('status').classList.remove('hidden');
    $('status').textContent = 'Disconnected, retrying...';
    $('scroller').classList.add('hidden');
    setTimeout(connect, 1000);
  };
}
connect();

$('full').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
};

if (isController) {
  $('stop').onclick = () => ws.send(JSON.stringify({ type: 'stop' }));
  addEventListener('keydown', e => {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    e.preventDefault();
    if (ws.readyState === WebSocket.OPEN)
      ws.send(JSON.stringify({ type: 'scroll', dir: e.key === 'ArrowUp' ? 'up' : 'down' }));
  });
}
</script>
</body>
</html>
